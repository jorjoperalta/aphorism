<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL Gym Tracker — aphorism.io</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    background-color: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .exercise-card.completed {
    opacity: 0.4;
    filter: grayscale(80%);
    border-left-color: #64748b !important;
  }
  .exercise-card.completed .ex-title {
    text-decoration: line-through;
    color: #94a3b8;
  }
</style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header & Nav -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 px-4 py-3 shadow-md">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-dumbbell text-blue-500 text-xl"></i>
        <h1 class="font-bold text-lg text-slate-100">PPL Tracker</h1>
      </div>
      <div id="auth-status" class="flex items-center gap-2">
        <button id="btn-open-auth" onclick="openAuthModal()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Log In / Sign Up
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4">

    <!-- Day Selector Buttons -->
    <div class="grid grid-cols-4 gap-2 mb-4">
      <button onclick="setDay('legs')" id="btn-day-legs" class="day-btn py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-blue-600 text-white shadow-lg transition">
        🔵 Legs
      </button>
      <button onclick="setDay('push')" id="btn-day-push" class="day-btn py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🔴 Push
      </button>
      <button onclick="setDay('pull')" id="btn-day-pull" class="day-btn py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        🟢 Pull
      </button>
      <button onclick="setDay('history')" id="btn-day-history" class="day-btn py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
        📜 History
      </button>
    </div>

    <!-- Rest Timer Widget -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-6 flex justify-between items-center shadow">
      <div class="flex items-center gap-2">
        <i class="fa-regular fa-clock text-amber-400"></i>
        <span class="text-xs font-semibold text-slate-300">Rest Timer:</span>
        <span id="timer-display" class="font-mono text-base font-bold text-amber-400">00:00</span>
      </div>
      <div class="flex gap-1.5">
        <button onclick="startTimer(120)" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-2.5 py-1 rounded font-semibold">2m</button>
        <button onclick="startTimer(180)" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-2.5 py-1 rounded font-semibold">3m</button>
        <button onclick="resetTimer()" class="bg-red-900/40 hover:bg-red-900/60 text-xs text-red-300 px-2.5 py-1 rounded font-semibold">Stop</button>
      </div>
    </div>

    <!-- Workout Container -->
    <div id="workout-container" class="space-y-4">
      <!-- Dynamic Exercises Rendered Here -->
    </div>

    <!-- History Container -->
    <div id="history-container" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-slate-200 mb-2">Logged Workout History</h2>
      <div id="history-list" class="space-y-3">
        <!-- Rendered History Items -->
      </div>
    </div>

    <!-- Save Workout Floating Button -->
    <div id="save-bar" class="mt-8 mb-12">
      <button onclick="saveCurrentWorkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center shadow-lg transition flex justify-center items-center gap-2">
        <i class="fa-solid fa-floppy-disk"></i> Save Session Log
      </button>
    </div>

  </main>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden px-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <h3 class="text-xl font-bold text-center mb-1 text-slate-100">Account Sync</h3>
      <p class="text-xs text-slate-400 text-center mb-6">Log in to sync workout logs across devices</p>

      <!-- Google 1-Click Button -->
      <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-semibold py-2.5 rounded-xl shadow transition flex justify-center items-center gap-3 mb-4 text-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="flex items-center my-4">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="px-3 text-xs text-slate-500 uppercase">Or Email</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 font-medium">Email</label>
          <input type="email" id="auth-email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Password</label>
          <input type="password" id="auth-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="loginWithEmail()" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm transition">Log In</button>
          <button onclick="signUpWithEmail()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 rounded-lg text-sm transition">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBOoRAVHd0M-k_j49CqD9bbjKbMMfnY5LM",
      authDomain: "youcompetemeapp-b73f9.firebaseapp.com",
      projectId: "youcompetemeapp-b73f9",
      storageBucket: "youcompetemeapp-b73f9.firebasestorage.app",
      messagingSenderId: "3787796633",
      appId: "1:3787796633:web:9e82f4a871a9f8e39f4808",
      measurementId: "G-ZD5GD1G4MQ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let currentActiveDay = 'legs';
    let timerInterval = null;

    // Workout Exercises Data Structure
    const workoutData = {
      legs: {
        title: "🔵 Day 1: Legs / Lower Body",
        accent: "border-blue-500",
        exercises: [
          { id: "leg_1", name: "1. Hack Squat / Barbell Squat", target: "Quads & Glutes", sets: "3 × 6–8", rest: "3 min", defaultWeight: 185 },
          { id: "leg_2", name: "2. Romanian Deadlifts (RDLs)", target: "Hamstrings & Glutes", sets: "3 × 8–10", rest: "3 min", defaultWeight: 155 },
          { id: "leg_3", name: "3. Leg Extensions", target: "Isolated Quads", sets: "3 × 10–12", rest: "2 min", defaultWeight: 110 },
          { id: "leg_4", name: "4. Seated or Lying Leg Curls", target: "Isolated Hamstrings", sets: "3 × 10–12", rest: "2 min", defaultWeight: 90 },
          { id: "leg_5", name: "5. Hip Adductor / Abductor Machine", target: "Inner/Outer Thighs", sets: "3 × 12–15", rest: "2 min", defaultWeight: 120 }
        ]
      },
      push: {
        title: "🔴 Day 2: Push (Chest, Shoulders, Triceps)",
        accent: "border-red-500",
        exercises: [
          { id: "push_1", name: "1. Flat Barbell Bench Press", target: "Chest & Triceps", sets: "3 × 6–8", rest: "3 min", defaultWeight: 175 },
          { id: "push_2", name: "2. Standing Overhead Press (OHP)", target: "Front Delts & Core", sets: "3 × 6–8", rest: "3 min", defaultWeight: 105 },
          { id: "push_3", name: "3. Incline Dumbbell Press", target: "Upper Chest", sets: "3 × 8–10", rest: "2.5 min", defaultWeight: 60 },
          { id: "push_4", name: "4. Cable or DB Chest Flys", target: "Chest Isolation", sets: "3 × 10–12", rest: "2 min", defaultWeight: 35 },
          { id: "push_5", name: "5. Lateral Raises", target: "Side Delts", sets: "3 × 12–15", rest: "2 min", defaultWeight: 25 },
          { id: "push_6", name: "6. Tricep Rope Pushdowns", target: "Tricep Isolation", sets: "3 × 10–12", rest: "2 min", defaultWeight: 55 }
        ]
      },
      pull: {
        title: "🟢 Day 3: Pull (Back, Biceps, Rear Delts)",
        accent: "border-emerald-500",
        exercises: [
          { id: "pull_1", name: "1. Lat Pulldowns", target: "Lats & Upper Back", sets: "3 × 8–10", rest: "3 min", defaultWeight: 140 },
          { id: "pull_2", name: "2. Seated Cable Rows", target: "Mid-Back Thickness", sets: "3 × 8–10", rest: "2.5 min", defaultWeight: 130 },
          { id: "pull_3", name: "3. Face Pulls", target: "Rear Delts & Rotator Cuff", sets: "3 × 12–15", rest: "2 min", defaultWeight: 45 },
          { id: "pull_4", name: "4. Bicep Curls (DB or BB)", target: "Bicep Isolation", sets: "3 × 10–12", rest: "2 min", defaultWeight: 35 },
          { id: "pull_5", name: "5. Farmer's Walk", target: "Traps, Core & Grip", sets: "3 × 45-60s", rest: "2 min", defaultWeight: 65 }
        ]
      }
    };

    // Global Functions Attached to Window
    window.openAuthModal = () => document.getElementById('auth-modal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
        closeAuthModal();
      } catch (e) { alert("Google Sign-In Error: " + e.message); }
    };

    window.loginWithEmail = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeAuthModal();
      } catch (e) { alert("Login Error: " + e.message); }
    };

    window.signUpWithEmail = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        closeAuthModal();
      } catch (e) { alert("Signup Error: " + e.message); }
    };

    window.logOut = () => signOut(auth);

    // Render Active Day
    window.setDay = (day) => {
      currentActiveDay = day;
      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'bg-red-600', 'bg-emerald-600', 'bg-purple-600', 'text-white');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });

      const activeBtn = document.getElementById(`btn-day-${day}`);
      activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
      activeBtn.classList.add('text-white');
      if (day === 'legs') activeBtn.classList.add('bg-blue-600');
      if (day === 'push') activeBtn.classList.add('bg-red-600');
      if (day === 'pull') activeBtn.classList.add('bg-emerald-600');
      if (day === 'history') activeBtn.classList.add('bg-purple-600');

      if (day === 'history') {
        document.getElementById('workout-container').classList.add('hidden');
        document.getElementById('save-bar').classList.add('hidden');
        document.getElementById('history-container').classList.remove('hidden');
        loadHistory();
      } else {
        document.getElementById('workout-container').classList.remove('hidden');
        document.getElementById('save-bar').classList.remove('hidden');
        document.getElementById('history-container').classList.add('hidden');
        renderWorkout(day);
      }
    };

    // Render Workout Day
    function renderWorkout(day) {
      const container = document.getElementById('workout-container');
      const data = workoutData[day];
      
      let html = `<h2 class="text-base font-bold text-slate-200 mb-3">${data.title}</h2>`;
      
      data.exercises.forEach(ex => {
        const savedWeight = localStorage.getItem(`weight_${ex.id}`) || ex.defaultWeight;
        const isDone = localStorage.getItem(`done_${ex.id}`) === 'true';

        html += `
          <div id="card-${ex.id}" class="exercise-card ${isDone ? 'completed' : ''} bg-slate-800 border-l-4 ${data.accent} border-y border-r border-slate-700/80 rounded-xl p-3.5 shadow-sm transition-all">
            <div class="flex justify-between items-start gap-2 mb-2">
              <div>
                <h3 class="ex-title font-bold text-sm text-slate-100">${ex.name}</h3>
                <p class="text-xs text-slate-400">Target: ${ex.target}</p>
              </div>
              <button onclick="toggleDone('${ex.id}')" class="btn-check flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold ${isDone ? 'bg-slate-700 text-slate-300' : 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30'}">
                <i class="fa-solid ${isDone ? 'fa-rotate-left' : 'fa-check'}"></i> ${isDone ? 'Undo' : 'Done'}
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/60 rounded-lg p-2 mt-2">
              <div>
                <span class="text-slate-500 block text-[10px] uppercase font-bold">Prescription</span>
                <span class="text-slate-300 font-medium">${ex.sets} | ⏱️ ${ex.rest}</span>
              </div>
              <div>
                <span class="text-slate-500 block text-[10px] uppercase font-bold">Weight (LBS)</span>
                <input type="number" value="${savedWeight}" onchange="updateWeight('${ex.id}', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-blue-400 font-bold focus:outline-none focus:border-blue-500">
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Toggle Done
    window.toggleDone = (id) => {
      const current = localStorage.getItem(`done_${id}`) === 'true';
      localStorage.setItem(`done_${id}`, !current);
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.classList.toggle('completed', !current);
      }
    };

    // Update Weight
    window.updateWeight = (id, val) => {
      localStorage.setItem(`weight_${id}`, val);
    };

    // Save Workout Session to Cloud or Local
    window.saveCurrentWorkout = async () => {
      const day = currentActiveDay;
      const data = workoutData[day];
      const logItem = {
        day: day,
        title: data.title,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now(),
        exercises: data.exercises.map(ex => ({
          name: ex.name,
          weight: localStorage.getItem(`weight_${ex.id}`) || ex.defaultWeight,
          completed: localStorage.getItem(`done_${ex.id}`) === 'true'
        }))
      };

      if (currentUser) {
        try {
          await addDoc(collection(db, "users", currentUser.uid, "logs"), logItem);
          alert("Workout logged successfully to Cloud!");
        } catch (e) {
          alert("Error saving to cloud: " + e.message);
        }
      } else {
        const localLogs = JSON.parse(localStorage.getItem('ppl_logs') || '[]');
        localLogs.unshift(logItem);
        localStorage.setItem('ppl_logs', JSON.stringify(localLogs));
        alert("Workout saved to local history!");
      }

      // Reset done toggles
      data.exercises.forEach(ex => localStorage.removeItem(`done_${ex.id}`));
      renderWorkout(day);
    };

    // Load History
    async function loadHistory() {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = `<p class="text-xs text-slate-400">Loading history...</p>`;

      let logs = [];
      if (currentUser) {
        try {
          const q = query(collection(db, "users", currentUser.uid, "logs"), orderBy("timestamp", "desc"));
          const snapshot = await getDocs(q);
          snapshot.forEach(doc => logs.push(doc.data()));
        } catch (e) {
          console.error(e);
        }
      } else {
        logs = JSON.parse(localStorage.getItem('ppl_logs') || '[]');
      }

      if (logs.length === 0) {
        historyList.innerHTML = `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-xs text-slate-400">No saved sessions found.</div>`;
        return;
      }

      let html = '';
      logs.forEach(log => {
        html += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-xs">
            <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
              <span class="font-bold text-slate-200">${log.title}</span>
              <span class="text-[10px] text-slate-400">${log.date}</span>
            </div>
            <div class="space-y-1">
              ${log.exercises.map(ex => `
                <div class="flex justify-between text-slate-300">
                  <span class="${ex.completed ? 'line-through text-slate-500' : ''}">${ex.name}</span>
                  <span class="font-bold text-blue-400">${ex.weight} lbs</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      historyList.innerHTML = html;
    }

    // Timer Logic
    window.startTimer = (seconds) => {
      clearInterval(timerInterval);
      let rem = seconds;
      updateTimerDisplay(rem);
      timerInterval = setInterval(() => {
        rem--;
        if (rem <= 0) {
          clearInterval(timerInterval);
          alert("Rest Time Up!");
          updateTimerDisplay(0);
        } else {
          updateTimerDisplay(rem);
        }
      }, 1000);
    };

    window.resetTimer = () => {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    };

    function updateTimerDisplay(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    // Auth Observer
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authStatus = document.getElementById('auth-status');
      if (user) {
        authStatus.innerHTML = `
          <span class="text-xs text-slate-300 font-medium truncate max-w-[120px]">${user.email || 'Google User'}</span>
          <button onclick="logOut()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded-lg">Log Out</button>
        `;
      } else {
        authStatus.innerHTML = `
          <button id="btn-open-auth" onclick="openAuthModal()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded-lg transition">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> Log In / Sign Up
          </button>
        `;
      }
    });

    // Initial Load
    renderWorkout('legs');
  </script>
</body>
</html>
